services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: enterprise-delivery-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery_copilot}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_copilot}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-delivery_copilot} -d ${POSTGRES_DB:-delivery_copilot}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-delivery-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://delivery_copilot:delivery_copilot@postgres:5432/delivery_copilot}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-gpt-4.1-mini}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.openai.com/v1/chat/completions}
      AI_LLM_TIMEOUT_SECONDS: ${AI_LLM_TIMEOUT_SECONDS:-120.0}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-aliyun_model_studio}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    ports:
      - '8000:8000'
    command: >
      sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
